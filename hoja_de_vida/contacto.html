<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="contactos.css">
    <link rel="stylesheet" href="styless.css">
    
</head>
<body>

    <header>
        <nav class="contenedor">

            <ul class="menu">
                <li class="menu_list"><a href="index.html">Inicio</a></li>

                <li class="menu_list"><a href="experiencias.html">Experiencias</a></li>

                <li class="menu_list"><a href="">Contacto</a></li>
            </ul>
            
        </nav>
    </header>

    <main class="main_1">

        <div class="datos">
            <label for="name">Nombre</label>
            <input type="text" id="name" placeholder="Tu Nombre">

            <label for="Celular">Celular</label>
            <input type="tel" id="Celular" maxlength="10" placeholder="+57 320 ..." oninput="this.value = this.value.replace(/[^0-9]/g, '');">>

            <label for="Email">Correo</label>
            <input type="email" id="Email" placeholder="ejemplo@gmail.com" required>

            <label for="clave">Contraseña</label>
            <input type="password" id="clave" maxlength="12" placeholder="ingresa tu clave" required>
        </div>

        <div class="datos">
            <label for="Mensaje">Mensaje</label>
            <textarea name="Mensaje" id="Mensaje" cols="30" rows="5" placeholder="Mensaje"></textarea>
        </div>

    </main>

     <footer>
        <p class="ultimo">Desarrollado por : Brayan Andres Gonzalez Perez</p>
    </footer>
    
    
</body>
</html>
